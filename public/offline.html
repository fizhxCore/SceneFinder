<head>

<title>Sedang offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#E9E9E6;color:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  h1{margin:0 0 8px;font-size:24px}
  p{margin:0 0 20px;color:#5b5b57;line-height:1.5}
  button{min-height:48px;padding:0 24px;border:0;border-radius:24px;background:#111;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
  <main>
    <h1>Sedang offline</h1>
    <p>SceneFinder butuh internet untuk memuat scene. Periksa sinyalmu, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>

</html>
