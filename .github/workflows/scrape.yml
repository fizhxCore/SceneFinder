#Bot pengambil data: jalan terjadwal di GitHub (gratis), ambil post lewat RapidAPI, commit hasilnya.
# Vercel deploy otomatis setelah commit. Tidak butuh VPS.
#
# Setup sekali saja di GitHub: Settings > Secrets and variables > Actions
#   Secret   RAPIDAPI_KEY            kunci dari RapidAPI
#   Variable RAPIDAPI_HOST           (opsional) host API yang kamu subscribe
#   Variable RAPIDAPI_PATH           (opsional) path endpoint postingan akun
#   Variable RAPIDAPI_PARAM          (opsional) nama parameter username
#   Variable RAPIDAPI_MAX_CALLS      (opsional) batas akun per run, 0 = semua
#   Secret   APIFY_TOKEN             (opsional) token Apify; bisa dipakai bersama atau menggantikan RapidAPI
#   Variable APIFY_ACTOR             (opsional) default apify~instagram-post-scraper
#   Variable APIFY_INPUT             (opsional) JSON input Actor, pakai {username} dan {amount}
#   Variable ASSETS_REPO             (opsional) repo gambar, mis. fizhxCore/SceneFinder-thumbs
#   Secret   ASSETS_TOKEN            token (Contents: write) untuk repo gambar
#   Variable COMMIT_NAME / COMMIT_EMAIL (opsional) identitas commit di repo utama; wajib milik pemilik akun kalau repo private di Vercel Hobby
#   Variable SCRAPER_PROVIDER        (opsional) auto | rapidapi | apify | apify,rapidapi (urutan prioritas)
name: Ambil scene baru

on:
  schedule:
    - cron: "0 1 * * *" # tiap hari 01:00 UTC (08:00 WIB). Makin sering = makin boros kuota RapidAPI
  workflow_dispatch:
    inputs:
      url:
        description: "Opsional: link postingan Instagram yang mau ditambahkan (dari halaman admin)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ambil repo gambar
        if: ${{ vars.ASSETS_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Ambil data (RapidAPI / Apify)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ vars.RAPIDAPI_HOST }}
          RAPIDAPI_PATH: ${{ vars.RAPIDAPI_PATH }}
          RAPIDAPI_BODY_FIELD: ${{ vars.RAPIDAPI_BODY_FIELD }}
          RAPIDAPI_AMOUNT: "12"
          RAPIDAPI_MAX_CALLS: ${{ vars.RAPIDAPI_MAX_CALLS }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ vars.APIFY_ACTOR }}
          APIFY_INPUT: ${{ vars.APIFY_INPUT }}
          APIFY_AMOUNT: "12"
          SCRAPER_PROVIDER: ${{ vars.SCRAPER_PROVIDER }}
          THUMBS_DIR: ${{ vars.ASSETS_REPO != '' && 'assets/thumbs' || '' }}
          ADD_URL: ${{ inputs.url }}
          APIFY_POST_ACTOR: ${{ vars.APIFY_POST_ACTOR }}
          NO_GIT: "1"
        run: node worker/scrape.mjs
      - name: Simpan gambar ke repo gambar
        if: ${{ vars.ASSETS_REPO != '' }}
        working-directory: assets
        run: |
          git config user.name "scene-finder-bot"
          git config user.email "scene-finder-bot@users.noreply.github.com"
          mkdir -p thumbs
          touch .nojekyll
          git add -A .nojekyll thumbs
          if git diff --cached --quiet; then
            echo "tidak ada gambar baru"
          else
            git commit -m "thumbs: update (bot)"
            git push
          fi
      - name: Simpan hasil ke repo
        run: |
          git config user.name "${{ vars.COMMIT_NAME || 'scene-finder-bot' }}"
          git config user.email "${{ vars.COMMIT_EMAIL || 'scene-finder-bot@users.noreply.github.com' }}"
          git add data public/thumbs
          if git diff --cached --quiet; then
            echo "tidak ada perubahan"
          else
            git commit -m "data: update scene (bot)"
            git push
          fi
